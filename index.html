<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff; --ink-soft:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.12); --glass-strong:rgba(255,255,255,.2);
  --edge:rgba(255,255,255,.42);
  --a:#19e3c4; --b:#7a5cff; --c:#ff5fa2; --d:#ffb347;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);
  background:#0a0d24;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;padding:32px 16px;
}
/* liquid backdrop */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:var(--b);left:-12vmax;top:-10vmax}
.blobs i:nth-child(2){width:38vmax;height:38vmax;background:var(--a);right:-10vmax;top:10vh;animation-duration:27s}
.blobs i:nth-child(3){width:34vmax;height:34vmax;background:var(--c);left:20vw;bottom:-14vmax;animation-duration:31s}
.blobs i:nth-child(4){width:22vmax;height:22vmax;background:var(--d);right:12vw;bottom:8vh;animation-duration:19s}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.18)}}

.glass{
  position:relative;z-index:1;width:min(640px,100%);
  padding:clamp(24px,5vw,44px);border-radius:36px;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));
  backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
  border:1px solid var(--edge);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.7),
    inset 0 -1.5px 0 rgba(255,255,255,.12),
    inset 0 0 40px rgba(255,255,255,.07),
    0 30px 80px rgba(5,5,40,.45);
}
.glass::before{ /* specular sheen */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 15% -10%,rgba(255,255,255,.38),transparent 55%);
}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;line-height:1.05;position:relative}
.lead{color:var(--ink-soft);margin:10px 0 28px;max-width:46ch;line-height:1.5;position:relative}

form{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px 4px;color:var(--ink-soft)}
input,select,textarea{
  width:100%;font:inherit;color:var(--ink);padding:13px 16px;border-radius:18px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 2px 8px rgba(0,0,30,.18);outline:none;
  transition:background .2s,border-color .2s,box-shadow .2s;
}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.45)}
select option{color:#111}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{
  background:rgba(255,255,255,.18);border-color:#fff;
  box-shadow:inset 0 2px 8px rgba(0,0,30,.12),0 0 0 4px rgba(255,255,255,.18);
}
button{
  font:inherit;font-weight:600;color:#10132e;cursor:pointer;border:0;
  padding:15px 22px;border-radius:999px;
  background:linear-gradient(135deg,#fff,#cfeeff 60%,#e6d9ff);
  box-shadow:inset 0 -3px 8px rgba(120,100,255,.25),0 10px 30px rgba(10,10,60,.35);
  transition:transform .15s,box-shadow .15s,opacity .2s;
}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}
.err{grid-column:1/-1;background:rgba(255,70,110,.25);border:1px solid rgba(255,140,160,.6);padding:12px 16px;border-radius:16px;font-size:14px}
.hp{position:absolute;left:-9999px}

/* result */
#done{display:none;position:relative}
.tick{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px;
  background:linear-gradient(135deg,var(--a),#6ef3a8);box-shadow:0 0 40px rgba(25,227,196,.6),inset 0 2px 0 rgba(255,255,255,.6)}
.tick svg{width:30px;height:30px;stroke:#06352d;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
dl{margin:22px 0;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);overflow:hidden}
dl div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.14)}
dl div:last-child{border:0}
dt{color:var(--ink-soft);font-size:14px}
dd{overflow-wrap:anywhere;white-space:pre-wrap}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.count{color:var(--ink-soft);font-size:14px}
@media(max-width:560px){form{grid-template-columns:1fr}dl div{grid-template-columns:1fr;gap:2px}}
@media(prefers-reduced-motion:reduce){.blobs i{animation:none}.tick svg{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main class="glass">
  <section id="formView">
    <h1>Order your software</h1>
    <p class="lead">Tell me what you need built. Your order is sent straight to my inbox and I'll reply by email.</p>
    <form id="orderForm" novalidate>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">
      <div><label for="name">Your name</label><input id="name" name="Name" required placeholder="Jane Perera" autocomplete="name"></div>
      <div><label for="email">Your email</label><input id="email" name="Email" type="email" required placeholder="jane@example.com" autocomplete="email"></div>
      <div><label for="phone">Phone / WhatsApp</label><input id="phone" name="Phone" type="tel" placeholder="+94 77 123 4567" autocomplete="tel"></div>
      <div>
        <label for="type">Software type</label>
        <select id="type" name="Software type" required>
          <option value="" disabled selected>Choose one</option>
          <option>Website</option><option>Mobile app</option><option>Desktop app</option>
          <option>Bot / automation</option><option>Game</option><option>Other</option>
        </select>
      </div>
      <div><label for="budget">Budget</label><input id="budget" name="Budget" placeholder="e.g. $200"></div>
      <div><label for="deadline">Needed by</label><input id="deadline" name="Deadline" type="date"></div>
      <div class="full"><label for="details">What should it do?</label><textarea id="details" name="Details" required placeholder="Describe the features, who will use it, and any examples you like."></textarea></div>
      <div id="err" class="err" role="alert" hidden></div>
      <button class="full" id="send" type="submit">Send order</button>
    </form>
  </section>

  <section id="done" aria-live="polite">
    <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Order sent</h1>
    <p class="lead">Here is what I received. I'll contact you at the email you gave.</p>
    <dl id="summary"></dl>
    <div class="row">
      <button id="goNow" type="button">Go to GitHub</button>
      <span class="count" id="count"></span>
    </div>
  </section>
</main>

<script>
const TO = "mathishayumeth5@gmail.com";
const BACK = "https://github.com/mathisha-yumeth";
const $ = id => document.getElementById(id);

$("orderForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, err = $("err"), btn = $("send");
  err.hidden = true;

  if (!f.Name.value.trim() || !f.Email.validity.valid || !f.Email.value || !f["Software type"].value || !f.Details.value.trim()) {
    err.textContent = "Please fill in your name, a valid email, the software type, and what it should do.";
    err.hidden = false; return;
  }

  const data = new FormData(f);
  data.append("_subject", "New software order from " + f.Name.value.trim());
  data.append("_template", "table");
  data.append("_captcha", "false");
  data.append("_replyto", f.Email.value);

  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const res = await fetch("https://formsubmit.co/ajax/" + TO, {
      method: "POST", headers: {Accept: "application/json"}, body: data
    });
    const out = await res.json();
    if (!res.ok || String(out.success) === "false") throw new Error(out.message || "Send failed");
    showResult(f);
  } catch (ex) {
    err.textContent = "Couldn't send the order. Check your connection and try again. " + (ex.message || "");
    err.hidden = false;
    btn.disabled = false; btn.textContent = "Send order";
  }
});

function showResult(f) {
  const rows = ["Name","Email","Phone","Software type","Budget","Deadline","Details"];
  const dl = $("summary"); dl.innerHTML = "";
  rows.forEach(k => {
    const v = (f[k].value || "").trim(); if (!v) return;
    const d = document.createElement("div"), dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = v; d.append(dt, dd); dl.append(d);
  });
  $("formView").style.display = "none";
  $("done").style.display = "block";

  let s = 12;
  const count = $("count");
  const tick = () => { count.textContent = "Returning to GitHub in " + s + "s"; if (s-- <= 0) location.href = BACK; };
  tick(); const t = setInterval(tick, 1000);
  $("goNow").onclick = () => { clearInterval(t); location.href = BACK; };
}
</script>
</body>
</html>
